<mat-drawer-container id="main" class="main-container" autosize>
  <mat-drawer id="sidenav" #drawer class="sidenav" mode="side">
    <app-sidebar></app-sidebar>
  </mat-drawer>

  <div id="page" class="sidenav-content">
    <mat-toolbar class="main-toolbar">
      <button
        matIconButton
        class="menu-button"
        aria-label="Toggle menu"
        (click)="drawer.toggle()"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">{{ title() }}</span>
      <span class="spacer"></span>
      <button
        matIconButton
        class="share-button"
        aria-label="Share"
        title="Compartilhar"
      >
        <mat-icon>share</mat-icon>
      </button>
    </mat-toolbar>

    <router-outlet />
  </div>
</mat-drawer-container>
