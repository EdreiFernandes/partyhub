<div class="example-container">
  @switch (gameStage()) { 
    @case (enum.SettingPlayers) {
      <app-players-list></app-players-list>
    }
    @case (enum.SettingWord) {
      <app-word-selector></app-word-selector>
    } 

  @case (enum.GivingMeaning) {
  <h2>Players meaning</h2>
  } @case (enum.Voting) {
  <h2>Players Voting</h2>
  } @case (enum.ShowingResult) {
  <h1>
    Jogando dicionario com 8 pessoas e com a palavra
    word
  </h1>
  <h2>wordMeaning</h2>
  } }

  <button matButton="filled" (click)="nextStage()">Ok</button>
</div>
