<app-title title="{{ game!.name }}"></app-title>
<div class="game-summary">
  <div class="tutorial-container">
    <div class="tutorial-content">
      <pre class="tutorial-text">{{ game!.howToPlay }}</pre>
    </div>
  </div>
  <div class="action-buttons">
    <button matButton="outlined" class="back-button" routerLink="/">
      <mat-icon>arrow_back</mat-icon>
      Voltar
    </button>
    <button matButton="filled" class="play-button" routerLink="{{game!.link}}">
      <mat-icon>play_arrow</mat-icon>
      Jogar Agora
    </button>
  </div>
</div>
