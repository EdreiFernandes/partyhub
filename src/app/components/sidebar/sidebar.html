<div class="sidebar-container">
  <div class="sidebar-header">
    <div class="logo-section">
      <mat-icon class="logo-icon">sports_esports</mat-icon>
      <h2 class="logo-text">PartyHub</h2>
    </div>
    <button 
      mat-icon-button 
      class="close-button mobile-only" 
      (click)="onCloseSidebar()"
      aria-label="Fechar menu"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-divider class="sidebar-divider"></mat-divider>

  <nav class="sidebar-nav">
    <mat-list class="nav-list">
      <mat-list-item class="nav-item">
        <button matButton class="nav-button" routerLink="/" routerLinkActive="active">
          <mat-icon class="nav-icon">home</mat-icon>
          <span class="nav-text">Início</span>
        </button>
      </mat-list-item>

      <mat-list-item class="nav-item">
        <button matButton class="nav-button" routerLink="/settings" routerLinkActive="active">
          <mat-icon class="nav-icon">settings</mat-icon>
          <span class="nav-text">Configurações</span>
        </button>
      </mat-list-item>
    </mat-list>
  </nav>

  <div class="sidebar-footer">
    <div class="footer-content">
      <p class="footer-text">Divirta-se com os amigos!</p>
      <div class="footer-icons">
        <mat-icon class="footer-icon">favorite</mat-icon>
        <mat-icon class="footer-icon">celebration</mat-icon>
        <mat-icon class="footer-icon">groups</mat-icon>
      </div>
    </div>
  </div>
</div>
